[project]
name = "devoppers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.7.0",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python backend/build_web.py"
