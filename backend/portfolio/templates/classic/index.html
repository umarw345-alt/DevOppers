{% extends "base.html" %}
{% import "_sections.html" as s %}
{% block body %}
<div class="page">
  <header>
    <h1>{{ resume.contact.name }}</h1>
    {{ s.headline(resume.contact) }}
    {{ s.contact_list(resume.contact) }}
  </header>
  <main>
    {% for name in sections %}{{ s.section(name, resume) }}{% endfor %}
  </main>
</div>
{% endblock %}
